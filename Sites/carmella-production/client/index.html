<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172417" />
    <title>%VITE_HTML_TITLE%</title>
    <meta name="description" content="%VITE_HTML_DESCRIPTION%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="%VITE_BASE_PATH%/manifest.json" />
    <link rel="apple-touch-icon" href="%VITE_BASE_PATH%/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker for offline caching, but NEVER auto-reload a
      // running session. A new worker installs in the background and takes over
      // on the next natural page load — so the app never jumps or refreshes
      // unexpectedly during a live demo.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%VITE_BASE_PATH%/sw.js', {
            scope: '%VITE_BASE_PATH%/',
            updateViaCache: 'none'
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
