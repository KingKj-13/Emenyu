<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="EMenu Luxury Edition — Premium Digital Dining Experience by Trump Restaurant">
  <meta name="theme-color" content="#080808">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EMenu Luxury">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EMenu Luxury Edition</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Premium loading screen matching the app's dark theme */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080808;
      font-family: 'Poppins', sans-serif;
    }

    /* Remove blue highlight on tap (iOS Safari) */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Loading indicator */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #080808;
    }

    .loading-text {
      color: #CBA26E;
      font-size: 14px;
      letter-spacing: 3px;
      font-weight: 500;
      margin-top: 24px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid #1F1B17;
      border-top-color: #CBA26E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">EMENU LUXURY EDITION</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
